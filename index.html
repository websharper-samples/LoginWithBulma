<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login with Bulma</title>
  <!-- Bulma -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" type="text/css" href="css/login.css" />
  <script type="text/javascript" src="Scripts/LoginWithBulma.head.js"></script>
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="box login-card">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="10.5" width="17" height="10.5" rx="2.5"></rect>
          <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"></path>
          <circle cx="12" cy="15.7" r="1.3" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>

      <h1 class="title is-4 has-text-centered login-title">Welcome back</h1>
      <p class="subtitle is-6 has-text-centered has-text-grey login-subtitle">
        Sign in to continue to your account
      </p>

      <form ws-onsubmit="Login" novalidate>
        <div class="field">
          <label class="field-label-compact" for="email">Email</label>
          <div class="control has-icons-left">
            <input id="email" class="input" type="email" placeholder="you@example.com"
                   autocomplete="email" ws-var="Email" ws-attr="AttrEmail" />
            <span class="icon is-small is-left">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.5" y="5" width="19" height="14" rx="2"></rect>
                <path d="m3 7 9 6 9-6"></path>
              </svg>
            </span>
          </div>
          <p class="help is-danger login-error" ws-attr="AttrEmailMessage">
            Please enter your email address.
          </p>
        </div>

        <div class="field">
          <label class="field-label-compact" for="password">Password</label>
          <div class="control has-icons-left">
            <input id="password" class="input" type="password" placeholder="Your password"
                   autocomplete="current-password" ws-var="Password" ws-attr="AttrPassword" />
            <span class="icon is-small is-left">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10.5" width="16" height="9.5" rx="2"></rect>
                <path d="M7.5 10.5V7.5a4.5 4.5 0 0 1 9 0v3"></path>
              </svg>
            </span>
          </div>
          <p class="help is-danger login-error" ws-attr="AttrPasswordMessage">
            Please enter your password.
          </p>
        </div>

        <div class="field login-options">
          <label class="checkbox has-text-grey">
            <input type="checkbox" ws-var="RememberMe" /> Remember me
          </label>
          <a class="is-size-7" href="#">Forgot password?</a>
        </div>

        <button type="submit" class="button is-primary is-fullwidth is-medium">Sign in</button>
      </form>

      <p class="has-text-centered login-foot">
        Don't have an account? <a href="#">Sign up</a>
      </p>
    </div>
  </main>

  <script type="module" src="Scripts/LoginWithBulma.min.js"></script>
</body>
</html>
